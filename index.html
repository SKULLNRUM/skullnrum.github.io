<style>
:root{color-scheme:dark;--black:#000;--white:#f4f1e9;--muted:#777;--gold:#a98b5d}

.departure{height:300svh;position:relative;background:#000}

.rum-content{position:absolute;inset:0;z-index:2;display:grid;align-content:center;justify-items:center;gap:clamp(12px,3vh,28px);text-align:center;pointer-events:none;opacity:0;will-change:opacity}
.rum-bottle{display:block;width:100%;height:100%;object-fit:cover;cursor:pointer;transform:scale(.08);opacity:.04;will-change:transform,opacity;pointer-events:auto;filter:grayscale(1) contrast(1.6);mix-blend-mode:screen}

.departure-stage.bottle-phase{background:radial-gradient(ellipse at 50% 54%,#0b0b09 0%,#030303 34%,#000 72%)}
.rum-label{color:#b9a27d;font:10px/1.6 Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase}
.rum-title{margin:0;color:#fff;font:clamp(25px,4.2vw,46px)/1.18 "Pirata One",Georgia,serif;letter-spacing:.025em;text-transform:uppercase;padding:0 16px}
.rum-copy{margin:0;color:#777;font:12px/1.8 Arial,sans-serif;letter-spacing:.12em}
.bottle-button{appearance:none;border:0;background:transparent;color:inherit;padding:0;cursor:pointer;width:min(42vw,250px,23svh);aspect-ratio:480/1150;overflow:visible;position:relative}.rum-bottle{position:absolute;width:213.33%;height:133.57%;max-width:none;max-height:none;left:-56.67%;top:-1.74%;object-fit:fill;clip-path:polygon(39% 1%,60% 1%,61% 6%,65% 9%,61% 14%,61% 19%,72% 25%,75% 32%,75% 65%,72% 73%,64% 76%,36% 76%,28% 73%,25% 65%,25% 32%,28% 25%,39% 19%,39% 14%,35% 9%,39% 6%);transform-origin:50% 38.7%}
.bottle-button:focus-visible{outline:1px solid var(--gold);outline-offset:12px}
.modal-backdrop{position:fixed;inset:0;z-index:10;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.84);backdrop-filter:blur(8px)}
.modal-backdrop.open{display:grid}
.auth-panel{position:relative;width:min(100%,430px);padding:clamp(26px,6vw,46px);border:1px solid #393329;background:#090908;box-shadow:0 24px 90px #000}
.close{position:absolute;right:16px;top:13px;border:0;background:none;color:#aaa;font-size:24px;cursor:pointer}
.auth-kicker{margin:0 0 12px;color:var(--gold);font:9px Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase}
.auth-title{margin:0 0 24px;font-size:30px;font-weight:400}
.tabs{display:flex;gap:22px;border-bottom:1px solid #302c25;margin-bottom:24px}

.tab[aria-selected="true"]{color:#eee;border-color:var(--gold)}
[hidden]{display:none!important}.field{display:grid;gap:8px;margin:15px 0}
.field label{color:#9b9488;font:9px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.field input{width:100%;padding:13px 12px;border:1px solid #39352e;background:#030303;color:#f4f1e9;font:14px Arial,sans-serif;border-radius:0}
.field input:focus{outline:1px solid var(--gold);border-color:var(--gold)}
.submit{width:100%;margin-top:12px;padding:15px;border:1px solid #8b754f;background:#17130e;color:#e9ddc8;font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.submit:hover{background:#292015}
.fineprint,.form-message{color:#777;font:11px/1.7 Arial,sans-serif}
.form-message{min-height:18px;color:#c9b58e}
@media(max-width:600px){.mark{width:min(82vw,467px)}.hint{font-size:clamp(25px,7vw,34px);letter-spacing:0}.bottle-button{width:min(58vw,220px,23svh)}}

-home .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)} #crew-home .post-actions{display:flex;gap:24px;margin-top:12px}#crew-home .post-actions button{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:#aaa;padding:7px 0;font-size:14px}#crew-home .post-actions button[aria-pressed=true]{color:#b94b51}#crew-home .post-actions button[aria-pressed=true] svg{fill:currentColor}#crew-home .comment-thread{border-top:1px solid #292929;margin-top:12px;padding-top:12px}#crew-home .comment-row{padding:12px 0;border-bottom:1px solid #222;overflow-wrap:anywhere}#crew-home .comment-row p{margin:6px 0}#crew-home .comment-row small{color:#888}#crew-home .comment-row button{border:0;background:transparent;color:#888;font-size:12px}#crew-home .comment-thread form{display:grid;gap:8px;margin-top:12px}#crew-home .comment-thread form button{justify-self:end}#crew-home .interaction-note{font-size:12px;color:#aaa;margin:4px 0}#crew-home .composer-tools{display:flex;align-items:center;justify-content:space-between}#crew-home #attach-image{background:transparent;border:0;color:#aaa;padding:8px}#crew-home #attachment-preview{position:relative}#attachment-preview img,.post-image{display:block;max-width:100%;max-height:520px;object-fit:contain;border-radius:5px;background:#080808}#crew-home #remove-image{position:absolute;right:8px;top:8px;border-radius:50%}.post-image{margin:12px 0;width:auto;height:auto}#crew-home #avatar-options{display:grid;gap:16px;margin:16px 0 22px}#crew-home .avatar-collection h3{font:20px "Pirata One",Georgia,serif;margin:0 0 10px;color:#b9a27d}#crew-home .avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}#crew-home .avatar-grid button{padding:3px;min-width:0;border-radius:4px}#crew-home .avatar-grid img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}#crew-home .avatar-grid button:disabled{opacity:.4;cursor:not-allowed}#crew-home .avatar-grid button[aria-pressed=true]{border-color:#e6d5a9;box-shadow:0 0 0 1px #e6d5a9}#crew-home .comment-identity{display:flex;align-items:center;gap:8px}#crew-home .comment-identity img{width:28px;height:28px;object-fit:contain;border-radius:50%}</style>

button><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" hidden><span></span><button id="publish-post" type="submit">Post</button></div></form><p id="feed-status" role="status"></p><button id="refresh-feed" type="button">Refresh feed</button><div id="feed-list"></div><button id="more-posts" type="button" hidden>Older posts</button></section><nav class="dead-bottom" aria-label="Main navigation"><button data-view="feed"><span>◉</span>Dead Air</button><button data-view="crew"><span>♧</span>Crew</button><button data-view="restricted"><span>♙</span>Restricted</button><button data-view="profile"><span>☠</span>Profile</button></nav></div>

<script>
(() => {
 const departure=document.getElementById('departure');
 const stage=document.getElementById('departure-stage');
 const bird=document.getElementById('bird');
 const hint=document.getElementById('hint');
 const bottle=document.querySelector('.rum-bottle');
 const rumContent=document.getElementById('rum-content');
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let ticking=false;
 function paintScene(){
  const travel=Math.max(1,window.innerHeight);
  const raw=(window.scrollY-departure.offsetTop)/travel;
  const birdProgress=reduce?1:Math.max(0,Math.min(1,raw));
  const bottleProgress=reduce?1:Math.max(0,Math.min(1,raw-1));
  // Preserve the original bird's exact diagonal flight and scale behavior.
  const x=window.innerWidth*.48*birdProgress;
  const y=-window.innerHeight*.46*birdProgress;
  const birdScale=1-.88*birdProgress;
  bird.style.transform='translate(calc(-50% + '+x+'px),calc(-50% + '+y+'px)) scale('+birdScale+')';
  bird.style.opacity=String(1-Math.max(0,(birdProgress-.78)/.22));
  hint.style.opacity=String(1-Math.min(1,birdProgress*4));
  // Once the bird has cleared the frame, the bottle grows forward from the same screen center.
  const eased=bottleProgress*bottleProgress*(3-2*bottleProgress);
  bottle.style.transform='scale('+(0.055+.945*eased)+')';
  bottle.style.opacity=String(.025+.975*Math.min(1,bottleProgress*2.15));
  rumContent.style.opacity=String(Math.min(1,bottleProgress*2.3));
  rumContent.style.pointerEvents=bottleProgress>.88?'auto':'none';
  stage.classList.toggle('bottle-phase',bottleProgress>0);
  ticking=false;
 }
 window.addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(paintScene);ticking=true;}},{passive:true});
 window.addEventListener('resize',paintScene);paintScene();

 const modal=document.getElementById('auth-modal');
 const open=document.getElementById('open-auth');
 const close=document.getElementById('close-auth');
 const signin=document.getElementById('signin-tab');
 const create=document.getElementById('create-tab');
 const nameField=document.getElementById('name-field');
 const submit=document.getElementById('submit-auth');
 const form=document.getElementById('auth-form');
 const message=document.getElementById('form-message');
 const db=window.supabase?.createClient('https://ivemrhhnlkabqnocreho.supabase.co','sb_publishable_UVv8yWhWE90HBtwArXyh2g_VXETnlKh');
 const account=document.getElementById('account-view');
 const tabs=modal.querySelector('.tabs');
 const title=document.getElementById('auth-title');
 const home=document.getElementById('crew-home'), intro=document.querySelector('main'), panel=document.getElementById('owner-profile'), status=document.getElementById('profile-status');
 const collections=[
 {name:'The Founder',files:['IMG_2269.jpeg','IMG_0575.jpeg','IMG_2331.jpeg','IMG_2266.jpeg','82749DD2-93D4-4530-AFB9-0950745D3C97.png'],allowed:p=>p.role==='owner'},
 {name:'The Wings',files:['IMG_2482.jpeg','IMG_2483.jpeg','IMG_2487.jpeg','IMG_2488.jpeg','IMG_2491.jpeg','IMG_2505.jpeg','IMG_2506.jpeg'],allowed:p=>p.role==='owner'||p.is_wing},
 {name:'The Crew',files:['IMG_2298.jpeg','IMG_2338.jpeg','IMG_2509.jpeg','IMG_2510.jpeg','IMG_2512.jpeg','IMG_2513.jpeg','IMG_2514.jpeg','IMG_2516.jpeg','IMG_2517.jpeg','IMG_2518.jpeg','IMG_2519.jpeg','IMG_2520.jpeg','IMG_2521.jpeg','IMG_2522.jpeg'],allowed:()=>true}
 ];
 const avatars=collections.flatMap(g=>g.files.map(f=>'assets/'+f));
 let currentProfile=null,selectedAvatar=null,searchVersion=0;
 function renderProfile(p){
  currentProfile=p;document.getElementById('attach-image').hidden=!(p.role==='owner'||p.is_wing||p.image_upload_allowed);
  const permitted=collections.filter(g=>g.allowed(p)).flatMap(g=>g.files.map(f=>'assets/'+f));
  selectedAvatar=permitted.includes(p.avatar_url)?p.avatar_url:permitted[0];
  document.getElementById('profile-name').textContent=p.username;
  document.getElementById('profile-role').textContent=p.role==='owner'?'Founder · Owner':p.is_wing?'The Wings':'The Crew';
  document.getElementById('profile-bio').value=p.bio||'';
  const image=document.getElementById('profile-avatar');image.hidden=false;image.src=selectedAvatar;
  const navAvatar=document.getElementById('nav-avatar');navAvatar.hidden=false;document.getElementById('nav-fallback').hidden=true;navAvatar.src=selectedAvatar;
  const options=document.getElementById('avatar-options');options.replaceChildren();
  for(const g of collections){const group=document.createElement('div'),heading=document.createElement('h3'),grid=document.createElement('div');group.className='avatar-collection';grid.className='avatar-grid';const allowed=g.allowed(p);heading.textContent=g.name+(allowed?'':' · Locked');group.append(heading,grid);
   g.files.forEach((f,i)=>{const path='assets/'+f,b=document.createElement('button'),im=document.createElement('img');b.type='button';im.src=path;im.loading='lazy';im.alt=g.name+' avatar '+(i+1);b.append(im);b.disabled=!allowed;b.setAttribute('aria-pressed',String(path===selectedAvatar));b.onclick=()=>{selectedAvatar=path;image.src=path;options.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status.textContent='Save profile to equip this avatar.';};grid.append(b);});options.append(group);
  }
 }
 const menu=document.getElementById('crew-menu'),menuPanel=document.getElementById('crew-menu-panel');menu.onclick=()=>{menuPanel.hidden=!menuPanel.hidden;menu.setAttribute('aria-expanded',String(!menuPanel.hidden));};
 function showView(view){const isFeed=view==='feed';document.getElementById('feed-section').hidden=!isFeed;document.getElementById('coming-view').hidden=isFeed||view==='profile';panel.hidden=view!=='profile';document.querySelectorAll('.dead-tabs button').forEach(b=>{if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});const titles={chat:'Live Chat',crew:'The Crew',restricted:'Restricted'};document.getElementById('coming-title').textContent=titles[view]||'';document.getElementById('coming-text').textContent=view==='crew'?'Find members using the search above. Friend requests are not open yet.':'Not open yet.';}
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));
 document.getElementById('profile-toggle').onclick=()=>showView(panel.hidden?'profile':'feed');
 document.getElementById('save-profile').onclick=async()=>{if(!currentProfile)return;const patch={bio:document.getElementById('profile-bio').value};patch.avatar_url=selectedAvatar;const {data,error}=await db.from('profiles').update(patch).eq('id',currentProfile.id).select('id,username,role,avatar_url,bio,is_wing,image_upload_allowed').single();if(error){status.textContent='Could not save profile.';return;}renderProfile(data);status.textContent='Profile saved.';await loadFeed();};
 document.getElementById('home-signout').onclick=async()=>{const {error}=await db.auth.signOut();if(!error)location.reload();else status.textContent='Sign out failed.';};
 document.getElementById('member-search').oninput=async e=>{const q=e.target.value.trim(),v=++searchVersion,out=document.getElementById('member-results');out.replaceChildren();if(!/^[a-zA-Z0-9_]{2,24}$/.test(q))return;const {data,error}=await db.from('profiles').select('username,role').ilike('username',q+'%').limit(20);if(v!==searchVersion)return;if(error){out.textContent='Search unavailable.';return;}for(const p of data){const el=document.createElement('p');el.textContent=p.username;out.append(el);}if(!data.length)out.textContent='No members found.';};
 const feed=document.getElementById('feed-list'), feedStatus=document.getElementById('feed-status'), more=document.getElementById('more-posts'), postForm=document.getElementById('post-form'), postBody=document.getElementById('post-body'), publish=document.getElementById('publish-post');
 const picker=document.getElementById('image-file'),attach=document.getElementById('attach-image'),preview=document.getElementById('attachment-preview'),previewImage=document.getElementById('preview-image'),removeImage=document.getElementById('remove-image');
 let chosenFile=null,previewUrl=null;
 const formats={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
 function clearImage(){chosenFile=null;picker.value='';preview.hidden=true;previewImage.removeAttribute('src');if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;}
 attach.onclick=()=>{if(!publish.disabled&&!attach.hidden)picker.click();};
 removeImage.onclick=()=>{if(!publish.disabled)clearImage();};
 picker.onchange=()=>{const f=picker.files[0];if(!f)return;clearImage();if(!formats[f.type]||f.size>5242880||!f.size){feedStatus.textContent='Choose a JPEG, PNG or WebP image up to 5 MB.';return;}chosenFile=f;previewUrl=URL.createObjectURL(f);previewImage.src=previewUrl;preview.hidden=false;feedStatus.textContent='';};
 let feedLimit=30,feedVersion=0;
 async function loadFeed(){
  if(!currentProfile)return;
  const version=++feedVersion;
  feedStatus.textContent='Listening…';
  const {data,error}=await db.from('posts').select('id,author_id,body,image_path,created_at,profiles!posts_author_id_fkey(username,avatar_url,role)').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(feedLimit+1);
  if(version!==feedVersion)return;
  if(error){feedStatus.textContent='Feed unavailable. Try refreshing.';return;}
  feed.replaceChildren();more.hidden=data.length<=feedLimit;
  feedStatus.textContent=data.length?'':'Dead Air is quiet. Leave the first post.';
  for(const p of data.slice(0,feedLimit)){
   const article=document.createElement('article'),head=document.createElement('div'),name=document.createElement('div'),author=document.createElement('div'),time=document.createElement('time'),body=document.createElement('p');
   head.className='post-head';author.className='post-author';body.className='post-body';
   const avatar=p.profiles?.avatar_url;
   if(avatars.includes(avatar)){const img=document.createElement('img');img.className='post-avatar';img.src=avatar;img.alt='';head.append(img);}
   author.textContent=p.profiles?.username||'Unknown member';time.dateTime=p.created_at;time.textContent=new Date(p.created_at).toLocaleString();name.append(author,time);head.append(name);body.textContent=p.body;article.append(head);if(p.body)article.append(body);
   if(p.image_path){const img=document.createElement('img');img.className='post-image';img.alt='Community post image';img.loading='lazy';article.append(img);db.storage.from('post-images').createSignedUrl(p.image_path,3600).then(({data,error})=>{if(!error&&data?.signedUrl)img.src=data.signedUrl;else img.alt='Image unavailable. Refresh feed to retry.';}).catch(()=>{img.alt='Image unavailable.';});}
   if(currentProfile.role==='owner'||currentProfile.id===p.author_id){const del=document.createElement('button');del.type='button';del.className='post-delete';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this post permanently?'))return;del.disabled=true;const {error}=await db.from('posts').delete().eq('id',p.id);if(error){feedStatus.textContent='Unable to delete post.';del.disabled=false;return;}if(p.image_path){const cleanup=await db.storage.from('post-images').remove([p.image_path]);if(cleanup.error){await loadFeed();feedStatus.textContent='Post deleted; image cleanup failed.';return;}}await loadFeed();};article.append(del);}
   const actions=document.createElement('div');actions.className='post-actions';
   const like=document.createElement('button'),reply=document.createElement('button'),thread=document.createElement('div');
   like.type=reply.type='button';thread.hidden=true;thread.className='comment-thread';
   const heart='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';
   const bubble='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a9 9 0 0 1-9 9 10 10 0 0 1-4-.8L3 21l1.3-5a9 9 0 1 1 16.7-4.5Z"/></svg>';
   let liked=false;
   const note=document.createElement('p');note.className='interaction-note';note.setAttribute('role','status');
   async function counts(){
    const [l,m,k]=await Promise.all([db.from('post_likes').select('post_id',{count:'exact',head:true}).eq('post_id',p.id),db.from('post_likes').select('post_id').eq('post_id',p.id).eq('user_id',currentProfile.id).maybeSingle(),db.from('post_comments').select('id',{count:'exact',head:true}).eq('post_id',p.id)]);
    liked=!!m.data;like.innerHTML=heart+' '+(l.error?'–':l.count);like.setAttribute('aria-pressed',String(liked));like.setAttribute('aria-label',liked?'Unlike post':'Like post');like.disabled=!!(l.error||m.error);reply.innerHTML=bubble+' '+(k.error?'–':k.count);reply.setAttribute('aria-label','Comments');if(l.error||m.error||k.error)note.textContent='Interactions unavailable. Check database setup.';
   }
   like.disabled=true;like.innerHTML=heart;reply.innerHTML=bubble;
   like.onclick=async()=>{like.disabled=true;try{const result=liked?await db.from('post_likes').delete().eq('post_id',p.id).eq('user_id',currentProfile.id):await db.from('post_likes').insert({post_id:p.id,user_id:currentProfile.id});if(result.error)note.textContent='Unable to update like.';else note.textContent='';await counts();}catch{note.textContent='Connection failed.';like.disabled=false;}};
   const comments=document.createElement('div'),composer=document.createElement('form'),field=document.createElement('textarea'),send=document.createElement('button');
   field.placeholder='Leave a reply…';field.setAttribute('aria-label','Write a comment');field.maxLength=1500;field.required=true;field.rows=2;send.type='submit';send.textContent='Reply';composer.append(field,send);thread.append(comments,composer);
   async function loadComments(){const {data,error}=await db.from('post_comments').select('id,author_id,body,created_at,profiles!post_comments_author_id_fkey(username,avatar_url)').eq('post_id',p.id).order('created_at',{ascending:true}).limit(100);if(error){note.textContent='Unable to load comments.';return;}comments.replaceChildren();for(const item of data){const row=document.createElement('div'),who=document.createElement('strong'),body=document.createElement('p'),time=document.createElement('small');row.className='comment-row';who.textContent=item.profiles?.username||'Unknown member';body.textContent=item.body;time.textContent=new Date(item.created_at).toLocaleString();const identity=document.createElement('div');identity.className='comment-identity';if(avatars.includes(item.profiles?.avatar_url)){const im=document.createElement('img');im.src=item.profiles.avatar_url;im.alt='';identity.append(im);}identity.append(who);row.append(identity,body,time);if(currentProfile.role==='owner'||item.author_id===currentProfile.id){const del=document.createElement('button');del.type='button';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete this comment?'))return;const {error}=await db.from('post_comments').delete().eq('id',item.id);if(error){note.textContent='Unable to delete comment.';return;}await loadComments();await counts();};row.append(del);}comments.append(row);}if(data.length===100){const msg=document.createElement('p');msg.textContent='Showing the first 100 comments.';comments.append(msg);}}
   reply.onclick=()=>{thread.hidden=!thread.hidden;reply.setAttribute('aria-expanded',String(!thread.hidden));if(!thread.hidden)loadComments();};reply.setAttribute('aria-expanded','false');
   composer.onsubmit=async e=>{e.preventDefault();const body=field.value.trim();if(!body||send.disabled)return;send.disabled=true;try{const {error}=await db.from('post_comments').insert({post_id:p.id,author_id:currentProfile.id,body});if(error){note.textContent='Unable to publish reply. Draft retained.';return;}field.value='';note.textContent='';await loadComments();await counts();}finally{send.disabled=false;}};
   actions.append(like,reply);article.append(actions,note,thread);feed.append(article);counts();
  }
 }
 document.getElementById('refresh-feed').onclick=()=>{feedLimit=30;loadFeed();};
 more.onclick=()=>{feedLimit+=30;loadFeed();};
 postForm.addEventListener('submit',async e=>{e.preventDefault();if(!currentProfile||publish.disabled)return;const body=postBody.value.trim(),file=chosenFile;if((!body&&!file)||body.length>3000)return;publish.disabled=true;attach.disabled=true;removeImage.disabled=true;let path=null;try{if(file){feedStatus.textContent='Uploading image…';const permission=await db.rpc('can_upload_images');if(permission.error||!permission.data){feedStatus.textContent='Image upload permission unavailable.';return;}path=currentProfile.id+'/'+crypto.randomUUID()+'.'+formats[file.type];const upload=await db.storage.from('post-images').upload(path,file,{contentType:file.type,upsert:false});if(upload.error){feedStatus.textContent='Image upload failed. Draft retained.';return;}}const {error}=await db.from('posts').insert({author_id:currentProfile.id,body,image_path:path});if(error){if(path)await db.storage.from('post-images').remove([path]);feedStatus.textContent='Unable to publish. Your draft is still here.';return;}postBody.value='';clearImage();feedLimit=30;await loadFeed();}catch{feedStatus.textContent='Connection failed. Refresh before retrying.';}finally{publish.disabled=false;attach.disabled=false;removeImage.disabled=false;}});
 async function refreshAccount(){
  if(!db){message.textContent='Connection unavailable. Please reload.';return;}
  const {data,error}=await db.auth.getUser();
  if(error||!data.user){account.hidden=true;form.hidden=false;tabs.hidden=false;title.textContent='Come aboard.';return;}
  const {data:profile,error:profileError}=await db.from('profiles').select('id,username,role,avatar_url,bio,is_wing,image_upload_allowed').eq('id',data.user.id).single();
  if(!profileError&&profile){renderProfile(profile);intro.hidden=true;home.hidden=false;hide();window.scrollTo(0,0);loadFeed();return;}
  account.hidden=false;form.hidden=true;tabs.hidden=true;title.textContent='The Crew';
  document.getElementById('account-name').textContent=profile?.username||'Account';
  document.getElementById('account-role').textContent=profileError?'Profile unavailable.':profile.role==='owner'?'Founder · Owner':profile.role;
 }
 document.getElementById('signout').addEventListener('click',async()=>{if(!db)return;const {error}=await db.auth.signOut();if(error){document.getElementById('account-role').textContent='Sign out failed. Try again.';return;}await refreshAccount();});
 let mode='signin';
 function setMode(next){
  mode=next;const creating=mode==='create';
  signin.setAttribute('aria-selected',String(!creating));
  create.setAttribute('aria-selected',String(creating));
  nameField.hidden=!creating;
  document.getElementById('display-name').required=creating;
  document.getElementById('password').autocomplete=creating?'new-password':'current-password';
  submit.textContent=creating?'Create account':'Sign in';
  message.textContent='';
 }
 function show(){modal.classList.add('open');document.body.classList.add('modal-open');setMode('signin');refreshAccount();document.getElementById('email').focus();}
 function hide(){modal.classList.remove('open');document.body.classList.remove('modal-open');open.focus();}
 open.addEventListener('click',show);close.addEventListener('click',hide);
 signin.addEventListener('click',()=>setMode('signin'));create.addEventListener('click',()=>setMode('create'));
 modal.addEventListener('click',e=>{if(e.target===modal)hide();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))hide();});
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!db){message.textContent='Connection unavailable. Please reload.';return;}
  submit.disabled=true;message.textContent='Signing in…';
  try{
   const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
   if(error){message.textContent='Unable to sign in. Check your credentials and try again.';return;}
   form.reset();message.textContent='';await refreshAccount();
  }catch{message.textContent='Connection failed. Please try again.';}finally{submit.disabled=false;}
 });
 if(db)refreshAccount();
})();
</script>

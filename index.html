<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="description" content="An independent artist world. Enter if you know.">
<meta property="og:title" content="The Departure">
<meta property="og:description" content="A world beyond the surface.">
<meta property="og:type" content="website">
<title>The Departure</title>
<style>
:root{color-scheme:dark;--black:#000;--white:#f4f1e9}
*{box-sizing:border-box}
html{background:var(--black);scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--white);font-family:Georgia,'Times New Roman',serif}
main{min-height:100svh;overflow:hidden}
.departure{min-height:100svh;position:relative;display:grid;place-items:center;background:#000}
.mark{width:min(68vw,467px);height:auto;display:block;image-rendering:auto;filter:contrast(1.04);animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(3vw,-2vh) scale(.88)}}
.hint{position:absolute;bottom:clamp(24px,6vh,58px);left:0;right:0;text-align:center;color:#777;font:10px/1.5 Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase;opacity:.72}
.next{min-height:100svh;display:grid;place-items:center;padding:12vw 8vw;background:#050505;border-top:1px solid #171717}
.next p{max-width:34rem;color:#777;text-align:center;font:clamp(12px,1.5vw,15px)/2 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:600px){.mark{width:min(82vw,467px)}.hint{letter-spacing:.25em}}
@media(prefers-reduced-motion:reduce){.mark{animation:none}}
</style>
</head>
<body>
<main>
<section class="departure" aria-label="The Departure">
<img class="mark" src="assets/bird-skull.png" alt="A white bird carrying a skull against a black field">
<div class="hint">Scroll to enter</div>
</section>
<section class="next" aria-label="Beyond the departure">
<p>The tide is turning.</p>
</section>
</main>
</body>
</html>
